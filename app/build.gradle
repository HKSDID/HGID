plugins {
    id 'com.android.application'
}

def keystorePropsFile = rootProject.file("signing.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    compileSdk 36
    namespace "com.mediatek.game"
    
    defaultConfig {
        applicationId "com.mediatek.game"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0"
        
        // Enable vector drawable support for smooth meter rendering
        vectorDrawables.useSupportLibrary = true
        
        // Optimize render performance
        renderscriptTargetApi 21
        renderscriptSupportModeEnabled true
    }

    // signing configuration: read from signing.properties, else from env vars
    signingConfigs {
        release {
            // storeFile: prefer the path in signing.properties, else use environment variable (useful for CI)
            def storeFilePath = keystoreProps.getProperty('storeFile') ?: System.getenv('RELEASE_KEYSTORE')
            if (storeFilePath) {
                storeFile file(storeFilePath)
            }

            // passwords and alias (prefer signing.properties)
            storePassword keystoreProps.getProperty('storePassword') ?: System.getenv('KEYSTORE_PASSWORD')
            keyAlias     keystoreProps.getProperty('keyAlias')     ?: System.getenv('KEY_ALIAS')
            keyPassword  keystoreProps.getProperty('keyPassword')  ?: System.getenv('KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            // Make sure release uses the signing config
            signingConfig signingConfigs.release

            // Optimizations with safe ProGuard rules
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Performance optimizations
            ndk {
                debugSymbolLevel 'full'
            }
        }
        debug {
            // Keep debug unsigned or use debug signing (do not reuse release keystore)
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Configure resource shrinking to preserve meter drawables
    bundle {
        enableSplit = false  // Keep resources together for consistent rendering
    }
}

dependencies {
    // Force Kotlin stdlib version consistency to resolve duplicate class conflicts
    implementation('org.jetbrains.kotlin:kotlin-stdlib:1.8.10') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    
    implementation('androidx.appcompat:appcompat:1.6.1') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    implementation('androidx.constraintlayout:constraintlayout:2.1.4') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    
    // Performance monitoring and lifecycle support
    implementation('androidx.core:core:1.10.1') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    implementation('androidx.lifecycle:lifecycle-runtime:2.6.2') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    implementation('androidx.lifecycle:lifecycle-process:2.6.2') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    
    // Real-time performance stats - Stable version for FPS monitoring
    implementation('androidx.graphics:graphics-core:1.0.0') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    
    // Android system services and permissions
    implementation('androidx.work:work-runtime:2.8.1') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }

    // Hardware acceleration and rendering optimization
    implementation('androidx.core:core-telemetry:1.0.0-alpha02') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}
