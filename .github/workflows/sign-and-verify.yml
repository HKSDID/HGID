name: Build and sign AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK command-line tools
        run: |
          set -e
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT
          curl -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools.zip -d cmdline-tools
          yes | $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Check if signing credentials are available
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "WARNING: Signing credentials not configured. Building unsigned APK only."
            echo "SKIP_SIGNING=true" >> $GITHUB_ENV
          else
            echo "SKIP_SIGNING=false" >> $GITHUB_ENV
          fi

      - name: Decode keystore
        if: env.SKIP_SIGNING == 'false'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release-keystore.jks

      - name: Create signing.properties (if keystore provided)
        if: env.SKIP_SIGNING == 'false'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > signing.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK and AAB (signed)
        if: env.SKIP_SIGNING == 'false'
        run: |
          ./gradlew :app:clean :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Build APK and AAB (unsigned)
        if: env.SKIP_SIGNING == 'true'
        run: |
          ./gradlew :app:clean :app:assembleDebug :app:bundleDebug --no-daemon

      - name: Verify APK signature
        if: env.SKIP_SIGNING == 'false'
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            $ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
          else
            echo "APK not found; verification skipped."
            exit 1
          fi

      - name: Upload signed artifacts
        if: env.SKIP_SIGNING == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: app-artifacts-signed
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk

      - name: Upload unsigned artifacts
        if: env.SKIP_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-artifacts-unsigned
          path: |
            app/build/outputs/bundle/debug/*.aab
            app/build/outputs/apk/debug/*.apk

      - name: Cleanup
        if: always()
        run: |
          rm -f release-keystore.jks signing.properties